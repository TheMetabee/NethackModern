# NetHack Modern: build the Linux game with the miniaudio soundlib and
# check that it starts, finds its sounds and reaches the map.
# Kept apart from upstream's build.yml so merges from upstream stay clean.

name: modern-linux

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-miniaudio:
    name: Linux tty/curses with miniaudio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # no audio development packages: miniaudio finds PulseAudio,
      # PipeWire or ALSA at run time
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev tmux

      - name: Generate makefiles
        run: sh sys/unix/setup.sh sys/unix/hints/linux.501

      - name: Compile and install
        run: |
          # hacklib.a first, on its own: in a parallel build, util asks src
          # for it (make hacklib.a there) while src is making it too, and a
          # tool can link against a half-written archive
          make -C src WANT_WIN_TTY=1 WANT_WIN_CURSES=1 \
            WANT_MINIAUDIO=1 hacklib.a
          make -j"$(nproc)" WANT_WIN_TTY=1 WANT_WIN_CURSES=1 \
            WANT_MINIAUDIO=1 install

      - name: Installed files
        working-directory: playground
        run: |
          test -f nhdat
          test -f sysconf
          ./nethack --version
          test -f sounds/hit_1.wav
          test -f sounds/amb_cave.flac
          test -f sounds/attributions.txt
          n=$(ls sounds | wc -l)
          echo "sounds installed: $n"
          test "$n" -ge "$(ls ../sound/modern | wc -l)"

      # play a few moves in a hidden terminal with the effects log on;
      # the runner has no sound card, so miniaudio may use its null
      # device or stay silent, but either way it must have been chosen
      - name: Play a few moves
        working-directory: playground
        run: |
          export NETHACK_FXLOG="$RUNNER_TEMP/fx.log"
          export NETHACKOPTIONS='name:ci,role:val,race:dwarf,gender:female,align:lawful,!tutorial,!legacy,!autopickup,windowtype:tty'
          tmux new-session -d -s nh -x 100 -y 30 \
            "env NETHACK_FXLOG=$NETHACK_FXLOG NETHACKOPTIONS='$NETHACKOPTIONS' ./nethack"
          sleep 4
          for k in h h h l l l j j k k s s; do
            tmux send-keys -t nh "$k"; sleep 0.3
          done
          sleep 1
          tmux capture-pane -p -t nh > "$RUNNER_TEMP/screen.txt"
          tmux send-keys -t nh S; sleep 1; tmux send-keys -t nh y; sleep 2
          tmux kill-session -t nh 2>/dev/null || true
          cat "$RUNNER_TEMP/screen.txt"
          echo "----- effects log"
          cat "$NETHACK_FXLOG"
          grep -q 'Dlvl:1' "$RUNNER_TEMP/screen.txt"
          grep -q 'miniaudio: init' "$NETHACK_FXLOG"
          if grep -q 'miniaudio: init ok' "$NETHACK_FXLOG"; then
            grep -q 'miniaudio: init ok, dir=".*/sounds/"' "$NETHACK_FXLOG"
          fi

  # a downloadable AppImage. Built on Ubuntu 22.04, so it needs no newer
  # C library than that (glibc 2.35) and runs on most current distros.
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    env:
      APPIMAGETOOL_VERSION: "1.9.1"
      APPIMAGE_RUNTIME_VERSION: "20251108"
      # no FUSE in a container: AppImages unpack themselves and run
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # SDL3 is built from source (22.04 has no packages for it); it loads
      # X11 and Wayland from the player's system, so only their headers
      # are needed here. DejaVu Sans Mono is the SDL window's font.
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends build-essential cmake pkg-config \
            libncurses-dev git ca-certificates curl file \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libwayland-bin wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libfreetype-dev fonts-dejavu-core

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, for the version in the file name

      - name: Build SDL3 and SDL3_ttf
        run: sh sys/unix/appimage/build-sdl3.sh /opt/sdl3 "$RUNNER_TEMP/sdl3-src"

      - name: Generate makefiles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh sys/unix/setup.sh sys/unix/hints/linux.501

      # the SDL window by default; the terminal versions as fallbacks
      - name: Compile and install
        run: |
          # hacklib.a first, on its own: in a parallel build, util asks src
          # for it (make hacklib.a there) while src is making it too, and a
          # tool can link against a half-written archive
          PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig \
          make -C src WANT_WIN_TTY=1 WANT_WIN_CURSES=1 \
            WANT_WIN_SDL=1 WANT_DEFAULT=sdl \
            WANT_MINIAUDIO=1 WANT_RELOCATABLE=1 hacklib.a
          PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig \
          make -j"$(nproc)" WANT_WIN_TTY=1 WANT_WIN_CURSES=1 \
            WANT_WIN_SDL=1 WANT_DEFAULT=sdl \
            WANT_MINIAUDIO=1 WANT_RELOCATABLE=1 install

      - name: Get appimagetool and the AppImage runtime
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL -o runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64"
          chmod +x appimagetool
          sha256sum appimagetool runtime-x86_64

      - name: Make the AppImage
        id: image
        run: |
          LD_LIBRARY_PATH=/opt/sdl3/lib \
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf \
          FONT_LICENSE=/usr/share/doc/fonts-dejavu-core/copyright \
          APPIMAGETOOL="$RUNNER_TEMP/tools/appimagetool" \
          APPIMAGE_RUNTIME="$RUNNER_TEMP/tools/runtime-x86_64" \
            sh sys/unix/appimage/build-appimage.sh playground dist
          ls -l dist
          # the download is named after the version too, like the Windows
          # zip: NetHackModern-v0.2.0-x86_64.AppImage comes as
          # NetHackModern-v0.2.0-linux-x86_64-AppImage.zip
          base=$(basename dist/*.AppImage .AppImage)
          echo "artifact=${base%-x86_64}-linux-x86_64-AppImage" \
            >> "$GITHUB_OUTPUT"

      # run the packed AppImage itself, from another directory, with the
      # build's own game directory and SDL out of the way: in a terminal
      # (no desktop here), then in its SDL window on SDL's off-screen
      # driver, which must draw a frame of a new game
      - name: Check the AppImage
        run: |
          mv playground playground.built
          mv /opt/sdl3 /opt/sdl3.built
          cd "$RUNNER_TEMP"
          image=$(ls "$GITHUB_WORKSPACE"/dist/*.AppImage)
          "$image" --version
          dir="$HOME/.local/share/nethackmodern"
          test -L "$dir/nhdat"
          test -f "$dir/sysconf"
          test -d "$dir/save"
          test -f "$dir/sounds/hit_1.wav"
          test -f "$dir/tiles.bmp"
          test -f "$dir/splash_art.png"
          test -f "$dir/fonts/DejaVuSansMono.ttf"
          DISPLAY=:0 SDL_VIDEO_DRIVER=offscreen \
          NETHACKOPTIONS='name:ci,role:val,race:human,gender:female,align:lawful,!tutorial,!legacy' \
          NETHACK_SDL_KEYS="pSy" NETHACK_SDL_SHOT="$RUNNER_TEMP/frame.png" \
            timeout 20 "$image" > sdl.out 2>&1 || true
          cat sdl.out
          test -s "$RUNNER_TEMP/frame.png"
          grep -q "welcome to NetHack" sdl.out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.image.outputs.artifact }}
          path: dist/*.AppImage
          retention-days: 30
          if-no-files-found: error

      # what the SDL window drew in the check above, to look at
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdl-frame
          path: ${{ runner.temp }}/frame.png
          retention-days: 7
          if-no-files-found: ignore
